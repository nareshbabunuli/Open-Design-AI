name: Remediate critical dependencies

on:
  push:
    branches:
      - security/production-hardening-2026-10
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/remediate-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lockfile:
    if: "!contains(github.event.head_commit.message, '[dependency-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/production-hardening-2026-10
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate dependency lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify TypeScript
        run: pnpm run typecheck
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "[dependency-bot] regenerate lockfile with security fixes"
            git push origin HEAD:security/production-hardening-2026-10
          fi
      - name: Verify production build
        env:
          # Inert placeholders so Next.js can complete the production build in CI
          # without real Supabase credentials. Runtime still requires real values.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build
        run: pnpm run build
      - name: Report remaining production advisories
        continue-on-error: true
        run: pnpm audit --prod
