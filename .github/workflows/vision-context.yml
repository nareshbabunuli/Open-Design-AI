name: Visual context regression checks

on:
  pull_request:
    paths:
      - "lib/ai-automation/vision-preprocessor.ts"
      - "tests/visual-context-integration.test.ts"
      - ".github/workflows/vision-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Test visual context extraction
        run: pnpm dlx tsx@4.23.15 --test tests/visual-context-integration.test.ts
