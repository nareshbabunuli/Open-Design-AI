name: Responsive journey verification

on:
  pull_request:
    paths:
      - "app/ai-simulator/page.tsx"
      - "app/api/ai-automation/**"
      - "components/design-review/responsive-journey-panel.tsx"
      - "components/design-review/workflow-simulator.tsx"
      - "lib/ai-automation/**"
      - "lib/browser/secure-browser.ts"
      - "tests/responsive*"
      - ".github/workflows/responsive-journeys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Check types
        run: pnpm exec tsc --noEmit --pretty false
      - name: Test combined automation, API and OpenCV regressions
        run: >-
          pnpm dlx tsx@4.23.15 --test
          tests/duo-review.test.mjs
          tests/action-ledger-reconciliation.test.ts
          tests/architecture-safety-patterns.test.ts
          tests/test-plan-safety.test.ts
          tests/job-boundary-safety.test.ts
          tests/visual-context-integration.test.ts
          tests/opencv-element-detector.test.ts
          tests/responsive-comparison.test.ts
          tests/responsive-routes.test.mjs
      - name: Install fixture browser
        run: pnpm exec puppeteer browsers install chrome
      - name: Test real browser capture, panel, uploads and navigation
        run: >-
          pnpm dlx tsx@4.23.15 --test
          tests/responsive-capture.browser.test.ts
          tests/responsive-panel.browser.test.mjs
          tests/upload-controls.test.ts
          tests/dom-discovery.test.mjs
          tests/dom-discovery.integration.test.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-journey-evidence
          path: test-results/responsive/
          if-no-files-found: ignore
          retention-days: 7
